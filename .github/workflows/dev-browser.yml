name: DEV Chromium browser smoke
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser tests on a local static server
        run: npx playwright test --config=playwright.config.cjs
        env:
          CI: 'true'
      - name: Preserve screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
